<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gitwig — now at gitwig.dev</title>
<!-- This project page is retired; gitwig.dev is the canonical home.
     GitHub Pages cannot issue a real 301 for a project site, so this combines
     rel=canonical (to consolidate ranking signal onto gitwig.dev) with an
     instant meta refresh and a scripted replace. -->
<link rel="canonical" href="https://gitwig.dev/">
<meta http-equiv="refresh" content="0; url=https://gitwig.dev/">
<script>location.replace("https://gitwig.dev/");</script>
<style>
  html { color-scheme: dark light; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; background: #14100e; color: #ece2d8;
    font: 16px/1.6 ui-sans-serif, system-ui, sans-serif; text-align: center;
  }
  a { color: #4db08a; }
</style>
</head>
<body>
  <p>Gitwig now lives at <a href="https://gitwig.dev/">gitwig.dev</a>.</p>
</body>
</html>
