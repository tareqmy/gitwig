# Gitwig Configuration File

# Repository/directory paths shown in the main list.
items = [
]

# List of pinned repository paths. Pinned items always stay on top.
pinned = [
]

# Event-loop poll interval in milliseconds.
# Lower → more responsive, higher → less CPU. Default: 100. Sane range: 16–500.
# The in-app Settings editor refuses values below 10.
poll_interval_ms = 100

# Maximum commits to load in workspace view. Default: 500; 0 = unlimited.
max_commits = 500

# Number of lines/items to scroll when PageUp or PageDown is pressed.
page_size = 10

# Default sort mode for the main page.
# Options: "custom", "alphabetical", "recent_visit", "latest_changes"
sort_by = "custom"

# Whether sorting should be reversed.
sort_reverse = false

# Active theme name selection.
# Resolves to themes/<theme_name>.theme beside the loaded config file
# (normally ~/.gitwig/themes/, e.g. "default" -> ~/.gitwig/themes/default.theme).
theme = "default"

# Configuration for interactive repository search and scanning.
[scan]
# Maximum depth of directories scanned from root.
max_depth = 6

# Starting directory for interactive repository discovery.
start_dir = "~/"

# Directory names to prune/exclude from scans and watch directories to keep search fast.
# An empty list is reset to these defaults on load, and "checkout" is added
# automatically whenever "target" is present.
excludes = ["node_modules", "target", "venv", ".venv", "checkout"]

# Deprecated: repository discovery is always git-only. The key is still accepted
# but ignored.
# git_only = true

